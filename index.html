<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global News Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#286140; --green-dark:#1f4d33; --gold:#B58500; --navy:#1B365D; --brown:#6E6259;
    --teal:#6BCABA; --maroon:#952E46; --gray:#C7C8CA;
    --white:#FFFFFF; --soft-white:#F2F2F2; --ink:#3A3A3A; --muted:#707070;
    --bg:#F7F4EE; --card:#FFFFFF; --line:#E6E2D9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  [dir="auto"]:lang(ar),[lang="ar"]{font-family:'IBM Plex Sans Arabic','Inter',sans-serif}

  header{background:var(--green);color:var(--white);padding:20px 24px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .header-inner{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:13px}
  .brand svg{width:32px;height:32px;stroke:var(--gold)}
  .brand h1{font-size:1.3rem;font-weight:700;letter-spacing:.2px}
  .brand p{font-size:.78rem;color:var(--soft-white);opacity:.85;margin-top:2px}
  .updated{font-size:.74rem;color:var(--soft-white);opacity:.85;display:flex;align-items:center;gap:6px}
  .updated svg{width:15px;height:15px;stroke:var(--gold)}

  main{max-width:1120px;margin:0 auto;padding:22px 20px 60px}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  @media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:3px}
  .stat .num{font-size:1.55rem;font-weight:700;color:var(--green);line-height:1}
  .stat .lbl{font-size:.76rem;color:var(--muted);font-weight:500}
  .stat.is-gold .num{color:var(--gold)}
  .stat.is-total{background:var(--green);border-color:var(--green)}
  .stat.is-total .num,.stat.is-total .lbl{color:var(--white)}

  .toolbar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;display:flex;flex-direction:column;gap:14px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1.5px solid var(--green);color:var(--green);background:transparent;border-radius:999px;
        padding:6px 15px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
  .chip:hover{background:rgba(40,97,64,.08)}
  .chip.active{background:var(--green);color:var(--white)}
  .row2{display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:10px;align-items:center}
  @media(max-width:760px){.row2{grid-template-columns:1fr 1fr}.field.search-field{grid-column:1 / -1}}
  .field{position:relative}
  .field>svg{position:absolute;top:50%;transform:translateY(-50%);left:11px;width:16px;height:16px;stroke:var(--muted);pointer-events:none}
  input[type=search],select{width:100%;border:1.5px solid var(--gray);border-radius:10px;background:var(--white);
    padding:9px 12px 9px 36px;font-family:inherit;font-size:.84rem;color:var(--ink);appearance:none}
  input[type=search]:focus,select:focus{outline:none;border-color:var(--green)}
  select{padding-left:12px}
  .sort-btn{border:1.5px solid var(--gray);background:var(--white);border-radius:10px;padding:9px 14px;
            font-family:inherit;font-size:.82rem;font-weight:600;color:var(--ink);cursor:pointer;display:flex;
            align-items:center;gap:7px;white-space:nowrap}
  .sort-btn:hover{border-color:var(--green);color:var(--green)}
  .sort-btn svg{width:15px;height:15px;stroke:currentColor}

  .result-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px}
  .result-bar .count{font-size:.82rem;color:var(--muted);font-weight:500}
  .result-bar .count b{color:var(--green);font-weight:700}

  .list{display:flex;flex-direction:column;gap:9px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 18px;
        display:flex;flex-direction:column;gap:9px;transition:.15s;border-left:3px solid var(--gold)}
  .item:hover{box-shadow:0 2px 12px rgba(0,0,0,.07);border-left-color:var(--green)}
  .item .title{font-size:.98rem;line-height:1.55;font-weight:600}
  .item .title a{color:var(--ink);text-decoration:none}
  .item .title a:hover{color:var(--green);text-decoration:underline;text-underline-offset:3px}
  .item-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
  .item-meta .m{display:flex;align-items:center;gap:5px}
  .item-meta .m svg{width:14px;height:14px;stroke:var(--muted)}
  .item-meta .source{color:var(--gold);font-weight:600}
  .item-meta .cats{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
  .cat-tag{background:rgba(40,97,64,.09);color:var(--green);border-radius:999px;padding:2px 9px;font-size:.68rem;font-weight:600}
  .open-link{color:var(--muted);display:inline-flex;align-items:center;gap:4px;text-decoration:none}
  .open-link:hover{color:var(--green)}
  .open-link svg{width:13px;height:13px;stroke:currentColor}

  .more{display:block;margin:22px auto 0;border:1.5px solid var(--green);color:var(--green);background:transparent;
        border-radius:999px;padding:9px 32px;font-family:inherit;font-size:.84rem;font-weight:600;cursor:pointer}
  .more:hover{background:var(--green);color:var(--white)}
  .more[hidden]{display:none}

  .state{text-align:center;color:var(--muted);padding:48px 0;font-size:.9rem}
  .spinner{width:32px;height:32px;border:3px solid var(--soft-white);border-top-color:var(--green);
           border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){.spinner{animation:none}}
  .error{background:rgba(149,46,70,.08);border:1px solid var(--maroon);color:var(--maroon);
         border-radius:12px;padding:14px 16px;font-size:.85rem;margin-bottom:16px;display:none}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18"/></svg>
      <div>
        <h1>Global News Monitor</h1>
        <p>Saudi Arabia, Gulf States &amp; war — from leading world sources, each in its original language</p>
      </div>
    </div>
    <div class="updated">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span id="lastUpdate">—</span>
    </div>
  </div>
</header>

<main>
  <div class="error" id="errorBox"></div>

  <section class="stats" aria-label="Statistics">
    <div class="stat is-total"><span class="num" id="stTotal">—</span><span class="lbl">Total</span></div>
    <div class="stat is-gold"><span class="num" id="stSaudi">—</span><span class="lbl">Saudi Arabia</span></div>
    <div class="stat"><span class="num" id="stGulf">—</span><span class="lbl">Gulf States</span></div>
    <div class="stat"><span class="num" id="stWar">—</span><span class="lbl">War</span></div>
  </section>

  <section class="toolbar" aria-label="Filters">
    <div class="chips" id="catChips">
      <button class="chip active" data-cat="">All</button>
      <button class="chip" data-cat="saudi">Saudi Arabia</button>
      <button class="chip" data-cat="gulf">Gulf States</button>
      <button class="chip" data-cat="war">War</button>
    </div>
    <div class="row2">
      <div class="field search-field">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="m21 21-6-6"/></svg>
        <input type="search" id="search" placeholder="Search headlines…">
      </div>
      <div class="field">
        <select id="sourceSel"><option value="">All sources</option></select>
      </div>
      <div class="field">
        <select id="langSel"><option value="">All languages</option></select>
      </div>
      <button class="sort-btn" id="sortBtn" title="Toggle order">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h13M3 12h9M3 18h5M18 9l3-3-3-3M21 6v12"/></svg>
        <span id="sortLabel">Newest</span>
      </button>
    </div>
  </section>

  <div class="result-bar">
    <span class="count"><b id="showing">0</b> results</span>
  </div>

  <section class="list" id="list" aria-live="polite">
    <div class="state"><div class="spinner"></div>Loading…</div>
  </section>
  <button class="more" id="moreBtn" hidden>Load more</button>
</main>

<script>
/* ============ CONFIG — put your project values here ============ */
const SUPABASE_URL = "https://tkmatxmnmphmuykhywtv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrbWF0eG1ubXBobXV5a2h5d3R2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MDM1NDgsImV4cCI6MjA5NTk3OTU0OH0.NUwIIhKfqILel1a12HL2NYS-R-iky0E2U7o9tlgtKac";
/* =============================================================== */

const PAGE = 100;
const CAT_LABEL = {saudi:"Saudi Arabia", gulf:"Gulf States", war:"War"};
const LANG_LABEL = {ar:"Arabic", en:"English", fr:"French", de:"German", it:"Italian",
                    es:"Spanish", ru:"Russian", ja:"Japanese", ko:"Korean", pt:"Portuguese",
                    tr:"Turkish", he:"Hebrew", fa:"Persian", zh:"Chinese"};

let state = {cat:"", search:"", source:"", lang:"", desc:true, offset:0, total:0};
const $ = id => document.getElementById(id);
const headers = {apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY};

function filterParams(){
  let p = "";
  if(state.cat)    p += "&categories=cs.{" + state.cat + "}";
  if(state.source) p += "&source_name=eq." + encodeURIComponent(state.source);
  if(state.lang)   p += "&language=eq." + encodeURIComponent(state.lang);
  if(state.search) p += "&title=ilike." + encodeURIComponent("*" + state.search + "*");
  return p;
}

async function countWhere(extra){
  const r = await fetch(SUPABASE_URL + "/rest/v1/global_news?select=id" + extra,
    {method:"HEAD", headers:{...headers, Prefer:"count=exact", Range:"0-0"}});
  const cr = r.headers.get("content-range");
  return cr ? cr.split("/")[1] : "0";
}

async function loadStats(){
  try{
    $("stTotal").textContent = await countWhere("");
    $("stSaudi").textContent = await countWhere("&categories=cs.{saudi}");
    $("stGulf").textContent  = await countWhere("&categories=cs.{gulf}");
    $("stWar").textContent   = await countWhere("&categories=cs.{war}");
  }catch(e){}
}

function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso);
  const diff = (Date.now() - d.getTime())/1000;
  if(diff < 3600)  return Math.max(1,Math.floor(diff/60)) + "m ago";
  if(diff < 86400) return Math.floor(diff/3600) + "h ago";
  if(diff < 604800) return Math.floor(diff/86400) + "d ago";
  return d.toLocaleDateString("en-GB", {day:"2-digit", month:"short", year:"numeric"});
}

function escapeHtml(s){return (s||"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

function render(rows, append){
  const list = $("list");
  if(!append) list.innerHTML = "";
  if(!rows.length && !append){
    list.innerHTML = '<div class="state">No results match the current filters.</div>';
    return;
  }
  for(const r of rows){
    const el = document.createElement("article");
    el.className = "item";
    const cats = (r.categories||[]).map(c=>'<span class="cat-tag">'+(CAT_LABEL[c]||c)+'</span>').join("");
    el.innerHTML =
      '<div class="title"><a href="'+r.link+'" target="_blank" rel="noopener" dir="auto" lang="'+(r.language||"")+'">'+
        escapeHtml(r.title)+'</a></div>'+
      '<div class="item-meta">'+
        '<span class="m source">'+escapeHtml(r.source_name)+'</span>'+
        '<span class="m">'+
          (LANG_LABEL[r.language]||r.language||"")+'</span>'+
        '<span class="m">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>'+
          fmtDate(r.published_at)+'</span>'+
        '<span class="cats">'+cats+
          '<a class="open-link" href="'+r.link+'" target="_blank" rel="noopener">Open '+
          '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></a>'+
        '</span>'+
      '</div>';
    list.appendChild(el);
  }
}

async function loadNews(append){
  if(!append){ state.offset = 0; $("list").innerHTML = '<div class="state"><div class="spinner"></div>Loading…</div>'; }
  try{
    const order = state.desc ? "desc" : "asc";
    const url = SUPABASE_URL + "/rest/v1/global_news?select=*" + filterParams() +
                "&order=published_at." + order + ".nullslast&order=id." + order;
    const r = await fetch(url, {headers:{...headers,
      Range: state.offset + "-" + (state.offset + PAGE - 1), "Range-Unit":"items", Prefer:"count=exact"}});
    if(!r.ok) throw new Error("HTTP " + r.status);
    const rows = await r.json();
    render(rows, append);
    const cr = r.headers.get("content-range");
    state.total = cr ? parseInt(cr.split("/")[1]) : 0;
    state.offset += rows.length;
    $("showing").textContent = state.total.toLocaleString("en-US");
    $("moreBtn").hidden = state.offset >= state.total;
    $("lastUpdate").textContent = "Updated " + new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  }catch(e){
    $("errorBox").style.display = "block";
    $("errorBox").textContent = "Couldn't reach the database. Check the Supabase URL and anon key at the top of index.html. (" + e.message + ")";
    $("list").innerHTML = "";
  }
}

async function loadFilterOptions(){
  try{
    const r = await fetch(SUPABASE_URL + "/rest/v1/global_news?select=source_name,language&limit=3000", {headers});
    const rows = await r.json();
    const srcs = new Set(), langs = new Set();
    rows.forEach(x=>{ if(x.source_name) srcs.add(x.source_name); if(x.language) langs.add(x.language); });
    [...srcs].sort().forEach(s=>{ const o=document.createElement("option"); o.value=s; o.textContent=s; $("sourceSel").appendChild(o); });
    [...langs].sort().forEach(l=>{ const o=document.createElement("option"); o.value=l; o.textContent=LANG_LABEL[l]||l; $("langSel").appendChild(o); });
  }catch(e){}
}

$("catChips").addEventListener("click", e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  b.classList.add("active"); state.cat = b.dataset.cat; loadNews(false);
});
let searchTimer;
$("search").addEventListener("input", e=>{
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{ state.search = e.target.value.trim(); loadNews(false); }, 400);
});
$("sourceSel").addEventListener("change", e=>{ state.source = e.target.value; loadNews(false); });
$("langSel").addEventListener("change", e=>{ state.lang = e.target.value; loadNews(false); });
$("sortBtn").addEventListener("click", ()=>{
  state.desc = !state.desc;
  $("sortLabel").textContent = state.desc ? "Newest" : "Oldest";
  loadNews(false);
});
$("moreBtn").addEventListener("click", ()=>loadNews(true));

setInterval(()=>{ if(state.offset <= PAGE){ loadNews(false); loadStats(); } }, 5*60*1000);

loadStats();
loadFilterOptions();
loadNews(false);
</script>
</body>
</html>
